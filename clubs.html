<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Selfstarters — Clubs</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;600;700&family=Work+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#142B4F;--cream:#F6F3EA;--white:#fff;--gold:#F2B705;--coral:#E8543E;--green:#2F8F5B;--ink:#14161A;--line:#DCD5C4;--muted:#6B6456}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"Work Sans",sans-serif}a{text-decoration:none;color:inherit}.wrap{max-width:1180px;margin:auto;padding:0 28px}h1,h2,h3{font-family:Anton,sans-serif;font-weight:400;text-transform:uppercase;line-height:.95;margin:0}.mono{font-family:"JetBrains Mono",monospace}
header{position:sticky;top:0;z-index:10;background:#f6f3eadd;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}nav{height:76px;display:flex;align-items:center;justify-content:space-between}.logo{font:400 1.45rem Anton;text-transform:uppercase}.dot{display:inline-block;width:10px;height:10px;background:var(--coral);border-radius:50%;margin-right:8px}.links{display:flex;gap:25px;list-style:none;font:600 .72rem "JetBrains Mono";text-transform:uppercase}.auth{display:flex;align-items:center;gap:8px}.btn{display:inline-flex;justify-content:center;align-items:center;border:1px solid var(--line);background:var(--white);padding:11px 16px;border-radius:8px;cursor:pointer;font-weight:700}.solid{background:var(--navy);color:#fff;border-color:var(--navy)}
.hero{background:var(--navy);color:#fff;padding:70px 0}.eyebrow{font:600 .72rem "JetBrains Mono";letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}.hero h1{font-size:clamp(3.5rem,8vw,7rem);margin:12px 0}.hero p{max-width:680px;color:#dce4ee;line-height:1.6}.controls{padding:28px 0;display:flex;gap:10px;flex-wrap:wrap}.search{flex:1;min-width:220px;padding:13px;border:1px solid var(--line);border-radius:8px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:999px;cursor:pointer}.chip.active{background:var(--navy);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-bottom:80px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;min-height:290px;display:flex;flex-direction:column}.patch{width:48px;height:48px;border-radius:10px;color:#fff;display:grid;place-items:center;font-weight:800}.card h3{font-size:1.8rem;margin:10px 0}.cat{font:700 .68rem "JetBrains Mono";text-transform:uppercase}.desc{color:var(--muted);line-height:1.5;min-height:48px}.meta{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;margin-top:auto;font:600 .65rem "JetBrains Mono";text-transform:uppercase}.open{color:var(--green)}.full{color:var(--coral)}.empty{text-align:center;padding:70px;color:var(--muted);grid-column:1/-1}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.links{display:none}}@media(max-width:560px){.grid{grid-template-columns:1fr}.wrap{padding:0 18px}}
</style></head><body>
<header><nav class="wrap"><a class="logo" href="./index.html"><span class="dot"></span>Selfstarters</a>
<ul class="links"><li><a href="./index.html">Home</a></li><li><a href="./clubs.html">Clubs</a></li><li><a href="./events.html">Events</a></li><li><a href="./about.html">About</a></li></ul><div class="auth" id="auth"></div></nav></header>
<section class="hero"><div class="wrap"><div class="eyebrow">Selfstarters · Student clubs</div><h1>Find your club.</h1><p>Browse clubs, see their information, and open a dedicated page for each club.</p></div></section>
<main class="wrap"><div class="controls"><input id="search" class="search" placeholder="Search clubs..."><div id="filters" class="chips"></div></div><div id="grid" class="grid"><div class="empty">Loading clubs...</div></div></main>
<script type="module">
import{db}from"./firebase-init.js";import{onReady,getProfile,doSignOut}from"./auth.js";import{collection,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const colors={Tech:"#E8543E",Academic:"#142B4F",Sports:"#2F8F5B",Games:"#8A4FB8",Arts:"#D98A1E",Other:"#6B6456"},icons={Tech:"◆",Academic:"∑",Sports:"●",Games:"♞",Arts:"✎",Other:"★"};let clubs=[],cat="All";
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
onReady((u,p)=>{auth.innerHTML=p?`<span class="mono">${esc(p.name||u.email)}</span><button class="btn" id="logout">Log out</button>`:`<a class="btn solid" href="./index.html#login">Log in</a>`;if(p)logout.onclick=doSignOut});
onSnapshot(collection(db,"clubs"),s=>{clubs=s.docs.map(d=>({id:d.id,...d.data()}));renderFilters();render()});
search.oninput=render;
function renderFilters(){let a=["All",...new Set(clubs.map(c=>c.category).filter(Boolean))];filters.innerHTML=a.map(x=>`<button class="chip ${x==cat?"active":""}" data-cat="${esc(x)}">${esc(x)}</button>`).join("");document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{cat=b.dataset.cat;renderFilters();render()})}
function render(){let q=search.value.toLowerCase().trim(),a=clubs.filter(c=>(cat=="All"||c.category==cat)&&(!q||`${c.name} ${c.desc} ${c.full} ${c.category}`.toLowerCase().includes(q)));grid.innerHTML=a.length?a.map(c=>{let col=colors[c.category]||colors.Other,total=+c.total||0,filled=+c.filled||0,full=total&&filled>=total;return`<article class="card"><div class="patch" style="background:${col}">${icons[c.category]||"★"}</div><span class="cat" style="color:${col}">${esc(c.category||"Other")}</span><h3>${esc(c.name)}</h3><p class="desc">${esc(c.desc||c.full||"No description yet.")}</p><div class="meta"><span>${esc(c.meets||"TBD")}</span><span class="${full?"full":"open"}">${full?"Full":Math.max(0,total-filled)+" open"}</span></div><a class="btn solid" style="margin-top:16px" href="./club.html?id=${encodeURIComponent(c.id)}">Open club page</a></article>`}).join(""):`<div class="empty">No clubs match your search.</div>`}
</script></body></html>
