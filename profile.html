<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Selfstarters — My Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;600;700&family=Work+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#142B4F;--cream:#F6F3EA;--white:#fff;--gold:#F2B705;--coral:#E8543E;--line:#DCD5C4;--muted:#6B6456;--ink:#14161A;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"Work Sans",sans-serif}
a{text-decoration:none;color:inherit}button,input,select{font:inherit}.wrap{max-width:1100px;margin:auto;padding:0 28px}
h1,h2,h3{font-family:Anton,sans-serif;font-weight:400;text-transform:uppercase;line-height:.95;margin:0}.mono{font-family:"JetBrains Mono",monospace}
header{position:sticky;top:0;z-index:20;background:#f6f3eadd;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav{height:76px;display:flex;align-items:center;justify-content:space-between}.logo{font:400 1.45rem Anton;text-transform:uppercase}.dot{display:inline-block;width:10px;height:10px;background:var(--coral);border-radius:50%;margin-right:8px}
.links{display:flex;gap:25px;list-style:none;font:600 .72rem "JetBrains Mono";text-transform:uppercase;padding:0;margin:0}.auth{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;padding:11px 16px;border-radius:8px;cursor:pointer;font-weight:700}.solid{background:var(--navy);color:#fff;border-color:var(--navy)}.danger{background:#fff3f1;color:var(--red);border-color:#e2b2aa}
.hero{background:var(--navy);color:#fff;padding:58px 0}.heroGrid{display:flex;align-items:center;gap:24px}.avatar{width:94px;height:94px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font:400 2rem Anton;flex:none}
.eyebrow{font:600 .72rem "JetBrains Mono";letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}.hero h1{font-size:clamp(3rem,7vw,6rem);margin:10px 0}.hero p{margin:0;color:#dce4ee}
.content{padding:42px 0 90px}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:22px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:20px}.panel h2{font-size:2rem;margin-bottom:18px}
.club{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;border-top:1px solid var(--line)}.club:first-child{border-top:0}.clubName{font-size:1.2rem;font-weight:800}.clubRole{display:inline-block;margin-top:7px;background:#eef2f7;color:var(--navy);padding:6px 9px;border-radius:999px;font:600 .62rem "JetBrains Mono";text-transform:uppercase}.clubActions{display:flex;gap:7px;flex-wrap:wrap}
.info{display:grid;gap:12px}.infoRow{padding-bottom:12px;border-bottom:1px solid var(--line)}.label{display:block;font:600 .63rem "JetBrains Mono";text-transform:uppercase;color:var(--muted);margin-bottom:4px}.small{font-size:.8rem;color:var(--muted);line-height:1.5}
.sectionTop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.editForm{display:grid;gap:13px}.field label{display:block;font:600 .63rem "JetBrains Mono";text-transform:uppercase;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff}.formActions{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:11px 13px;border-radius:8px;background:#eef7f0;color:#23613b;font-size:.85rem;margin-bottom:12px}.error{background:#fff1ef;color:var(--red)}
.loading{text-align:center;padding:100px;color:var(--muted)}.hidden{display:none!important}.empty{padding:25px 0;color:var(--muted)}
@media(max-width:760px){.links{display:none}.grid{grid-template-columns:1fr}.heroGrid{align-items:flex-start}.wrap{padding:0 18px}.club{align-items:flex-start;flex-direction:column}.clubActions{justify-content:flex-start}}
</style>
</head>
<body>
<header>
<nav class="wrap">
<a class="logo" href="./index.html"><span class="dot"></span>Selfstarters</a>
<ul class="links"><li><a href="./index.html">Home</a></li><li><a href="./clubs.html">Clubs</a></li><li><a href="./events.html">Events</a></li><li><a href="./about.html">About</a></li></ul>
<div id="auth" class="auth"></div>
</nav>
</header>

<div id="loading" class="loading">Loading your profile...</div>

<section id="page" class="hidden">
<section class="hero">
<div class="wrap heroGrid">
<div id="avatar" class="avatar">S</div>
<div><div class="eyebrow">My profile</div><h1 id="name">Student</h1><p id="roleLine">Student</p></div>
</div>
</section>

<main class="content wrap">
<div id="message"></div>
<div class="grid">
<section>
<div class="panel">
<div class="sectionTop"><h2>My clubs</h2><a class="btn solid" href="./clubs.html">Explore clubs</a></div>
<div id="clubsList"><div class="empty">Loading clubs...</div></div>
</div>
</section>

<aside>
<section class="panel">
<h2>Account</h2>
<div class="info">
<div class="infoRow"><span class="label">Name</span><strong id="infoName">—</strong></div>
<div class="infoRow"><span class="label">Email</span><strong id="infoEmail">—</strong></div>
<div class="infoRow"><span class="label">Grade</span><strong id="infoGrade">—</strong></div>
<div class="infoRow"><span class="label">Account role</span><strong id="infoRole">—</strong></div>
</div>
</section>

<section class="panel">
<h2>Change name</h2>
<form id="nameForm" class="editForm">
<div class="field"><label for="newName">Display name</label><input id="newName" maxlength="60" required></div>
<div class="formActions"><button class="btn solid" type="submit">Save name</button></div>
</form>
</section>

<section class="panel">
<h2>Password</h2>
<p class="small">We'll send a password-reset email to your account email.</p>
<button class="btn" id="resetBtn">Send reset email</button>
</section>

<section class="panel">
<h2>Account</h2>
<button class="btn danger" id="logoutBtn">Log out</button>
</section>
</aside>
</div>
</main>
</section>

<script type="module">
import { auth, db } from './firebase-init.js';
import { onReady, doSignOut } from './auth.js';
import { updateProfile as updateAuthProfile, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const initials=name=>(name||'Student').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();

function showMessage(text,error=false){
  $('message').innerHTML=`<div class="notice ${error?'error':''}">${esc(text)}</div>`;
  setTimeout(()=>{$('message').innerHTML=''},4000);
}

async function loadClubs(user){
  /*
    We intentionally do not use collectionGroup().
    We first read the clubs collection, then read only the current user's
    member document inside each club.
  */
  const clubsSnap=await getDocs(collection(db,'clubs'));
  const rows=[];
  for(const clubDoc of clubsSnap.docs){
    try{
      const memberSnap=await getDoc(doc(db,'clubs',clubDoc.id,'members',user.uid));
      if(memberSnap.exists()){
        rows.push({id:clubDoc.id,club:clubDoc.data(),member:memberSnap.data()});
      }
    }catch(err){
      console.warn('Could not read membership for club '+clubDoc.id,err);
    }
  }

  rows.sort((a,b)=>String(a.club.name||'').localeCompare(String(b.club.name||'')));

  if(!rows.length){
    $('clubsList').innerHTML='<div class="empty">You are not a member of any clubs yet.<br><br><a class="btn solid" href="./clubs.html">Explore clubs</a></div>';
    return;
  }

  $('clubsList').innerHTML=rows.map(x=>`
    <div class="club">
      <div>
        <div class="clubName">${esc(x.club.name||'Club')}</div>
        <span class="clubRole">${esc(x.member.role||'Member')}</span>
        <div class="small">${esc(x.club.category||'Other')} · ${esc(x.club.meets||'Meeting TBD')}</div>
      </div>
      <div class="clubActions">
        <a class="btn solid" href="./club.html?id=${encodeURIComponent(x.id)}">Open club</a>
      </div>
    </div>
  `).join('');
}

async function loadProfile(user,profile){
  const freshSnap=await getDoc(doc(db,'users',user.uid));
  const data=freshSnap.exists()?freshSnap.data():(profile||{});

  const displayName=data.name||user.displayName||user.email?.split('@')[0]||'Student';
  $('avatar').textContent=initials(displayName);
  $('name').textContent=displayName;
  $('roleLine').textContent=data.role==='admin'?'Administrator':`Grade ${data.grade||'—'}`;
  $('infoName').textContent=displayName;
  $('infoEmail').textContent=user.email||data.email||'—';
  $('infoGrade').textContent=data.grade||'—';
  $('infoRole').textContent=data.role==='admin'?'Administrator':'Student';
  $('newName').value=displayName;

  await loadClubs(user);
}

onReady(async(user,profile)=>{
  if(!user){location.href='./index.html#login';return;}

  const displayName=profile?.name||user.displayName||user.email;
  $('auth').innerHTML=`<a class="mono" href="./profile.html">${esc(displayName)}</a>`;
  $('logoutBtn').onclick=()=>doSignOut();

  $('nameForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const newName=$('newName').value.trim();
    if(!newName)return;
    try{
      await updateAuthProfile(user,{displayName:newName});
      await setDoc(doc(db,'users',user.uid),{name:newName},{merge:true});
      $('name').textContent=newName;
      $('infoName').textContent=newName;
      $('avatar').textContent=initials(newName);
      showMessage('Your name was updated.');
    }catch(err){
      console.error(err);
      showMessage('Could not update your name. Please try again.',true);
    }
  });

  $('resetBtn').onclick=async()=>{
    try{
      await sendPasswordResetEmail(auth,user.email);
      showMessage('Password reset email sent. Check your inbox and spam folder.');
    }catch(err){
      console.error(err);
      showMessage('Could not send the reset email.',true);
    }
  };

  try{
    await loadProfile(user,profile);
    $('loading').classList.add('hidden');
    $('page').classList.remove('hidden');
  }catch(err){
    console.error(err);
    $('loading').textContent='Your account information could not be loaded. Check the browser console for the exact Firebase error.';
  }
});
</script>
</body>
</html>
